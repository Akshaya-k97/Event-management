services:
  db:
    image: postgres:16-alpine
    container_name: unisphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unisphere
      POSTGRES_PASSWORD: unisphere
      POSTGRES_DB: unisphere
    ports:
      - "5432:5432"
    volumes:
      - unisphere_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: unisphere-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  unisphere_pgdata: