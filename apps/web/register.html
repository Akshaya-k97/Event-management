<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — UniSphere Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif; padding: 1rem;
    }
    .auth-card {
      background: white; border-radius: 16px; padding: 2.5rem;
      max-width: 460px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .brand {
      font-weight: 700; font-size: 1.6rem; text-align: center;
      background: linear-gradient(45deg, #4361ee, #4cc9f0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(45deg, #4361ee, #3a0ca3);
      border: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand"><i class="fas fa-globe-americas me-2"></i>UniSphere Events</div>
      <p class="text-muted mb-0">Create your account</p>
    </div>

    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label">Full name *</label>
        <input type="text" id="fullName" name="fullName" class="form-control" required minlength="2">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password *</label>
        <input type="password" id="password" name="password" class="form-control"
               required minlength="8" autocomplete="new-password">
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="studentId" class="form-label">Student ID</label>
          <input type="text" id="studentId" name="studentId" class="form-control" placeholder="UNI-2023-0451">
        </div>
        <div class="col-md-6 mb-3">
          <label for="department" class="form-label">Department</label>
          <input type="text" id="department" name="department" class="form-control" placeholder="Computer Science">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fas fa-user-plus me-2"></i>Create account
      </button>
    </form>

    <p class="text-center mt-4 mb-0">
      Already have an account? <a href="/login.html">Sign in</a>
    </p>
  </div>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
