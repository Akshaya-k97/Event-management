<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — UniSphere Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }
    .auth-card {
      background: white; border-radius: 16px; padding: 2.5rem;
      max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .brand {
      font-weight: 700; font-size: 1.6rem; text-align: center;
      background: linear-gradient(45deg, #4361ee, #4cc9f0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(45deg, #4361ee, #3a0ca3);
      border: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand"><i class="fas fa-globe-americas me-2"></i>UniSphere Events</div>
      <p class="text-muted mb-0">Sign in to your account</p>
    </div>

    <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@unisphere.edu" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fas fa-sign-in-alt me-2"></i>Sign in
      </button>
    </form>

    <hr class="my-4">
    <p class="text-center text-muted mb-3 small">Demo accounts (password: <code>Password123!</code>)</p>
    <div class="d-grid gap-2">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-demo="admin@unisphere.edu">
        Admin — admin@unisphere.edu
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-demo="organizer@unisphere.edu">
        Organizer — organizer@unisphere.edu
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm" data-demo="student@unisphere.edu">
        Student — student@unisphere.edu
      </button>
    </div>

    <p class="text-center mt-4 mb-0">
      Don't have an account? <a href="/register.html">Create one</a>
    </p>
  </div>

  <script>
    // Quick-fill helper
    document.querySelectorAll('[data-demo]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelector('#email').value = btn.dataset.demo;
        document.querySelector('#password').value = 'Password123!';
      });
    });
  </script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
